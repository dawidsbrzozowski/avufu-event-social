name: Publikuj posty (IG + FB)

# Czyta kolejke w queue/ i publikuje posty, ktorych czas nadszedl,
# przez Meta Graph API. Udane przenosi do published/.
#
# Na start dziala TYLKO recznie (workflow_dispatch) - zeby przetestowac
# po wgraniu sekretow. Gdy test przejdzie, ODKOMENTUJ blok `schedule`
# ponizej, aby publikacja chodzila automatycznie.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'   # co 15 min (czas UTC!). Repo publiczne = minuty Actions bez limitu.

permissions:
  contents: write   # pozwala zapisac przeniesione posty (queue -> published) z powrotem do repo

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publikuj zalegle posty
        env:
          GRAPH_VERSION: v23.0
          EVENT_IG_TOKEN:        ${{ secrets.TRAINING_IG_TOKEN }}   # bot avufu-publisher-bot ma przypisane @event.avufu -> ten sam SUAT publikuje na Event (brak regeneracji, Training bezpieczny)
          EVENT_IG_USER_ID:      "17841460345842460"                # @event.avufu IG Business Account id (jawne, nie-tajne)
          EVENT_FB_PAGE_TOKEN:   ${{ secrets.EVENT_FB_PAGE_TOKEN }}
          EVENT_FB_PAGE_ID:      ${{ secrets.EVENT_FB_PAGE_ID }}
          TRAINING_IG_TOKEN:     ${{ secrets.TRAINING_IG_TOKEN }}
          TRAINING_IG_USER_ID:   ${{ secrets.TRAINING_IG_USER_ID }}
          TRAINING_FB_PAGE_TOKEN: ${{ secrets.TRAINING_FB_PAGE_TOKEN }}
          TRAINING_FB_PAGE_ID:    ${{ secrets.TRAINING_FB_PAGE_ID }}
        run: python scripts/publish.py

      - name: Zapisz zmiany w kolejce
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A queue published failed 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Publikacja: aktualizacja kolejki [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
