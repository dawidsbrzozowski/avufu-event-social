name: Publikuj posty (IG + FB)

# Czyta kolejke w queue/ i publikuje posty, ktorych czas nadszedl,
# przez Meta Graph API. Udane przenosi do published/.
#
# Na start dziala TYLKO recznie (workflow_dispatch) - zeby przetestowac
# po wgraniu sekretow. Gdy test przejdzie, ODKOMENTUJ blok `schedule`
# ponizej, aby publikacja chodzila automatycznie.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'   # co 15 min (czas UTC!). Repo publiczne = minuty Actions bez limitu.

permissions:
  contents: write   # pozwala zapisac przeniesione posty (queue -> published) z powrotem do repo

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Token strony Heritage wyznaczamy w locie z SUAT bota (strona Seek the Cradle
      # musi byc przypieta do avufu-publisher-bot). Dzieki temu token nigdy sie nie
      # starzeje i nie trzymamy go w sekretach. Maskowany w logach.
      - name: Wyznacz token strony Heritage z SUAT bota
        env:
          SUAT: ${{ secrets.TRAINING_IG_TOKEN }}
          PAGE_ID: "1508324085691105"
        run: |
          PT=$(curl -s "https://graph.facebook.com/v23.0/${PAGE_ID}?fields=access_token&access_token=${SUAT}" \
               | python -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          if [ -n "$PT" ]; then
            echo "::add-mask::$PT"
            echo "HERITAGE_FB_PAGE_TOKEN=$PT" >> "$GITHUB_ENV"
            echo "Heritage page token: wyznaczony OK"
          else
            echo "Heritage page token: BRAK - strona nie przypieta do bota? FB Heritage czeka."
          fi

      - name: Publikuj zalegle posty
        env:
          GRAPH_VERSION: v23.0
          EVENT_IG_TOKEN:        ${{ secrets.TRAINING_IG_TOKEN }}   # bot avufu-publisher-bot ma przypisane @event.avufu -> ten sam SUAT publikuje na Event (brak regeneracji, Training bezpieczny)
          EVENT_IG_USER_ID:      "17841460345842460"                # @event.avufu IG Business Account id (jawne, nie-tajne)
          EVENT_FB_PAGE_TOKEN:   ${{ secrets.EVENT_FB_PAGE_TOKEN }}
          EVENT_FB_PAGE_ID:      ${{ secrets.EVENT_FB_PAGE_ID }}
          TRAINING_IG_TOKEN:     ${{ secrets.TRAINING_IG_TOKEN }}
          TRAINING_IG_USER_ID:   ${{ secrets.TRAINING_IG_USER_ID }}
          TRAINING_FB_PAGE_TOKEN: ${{ secrets.TRAINING_FB_PAGE_TOKEN }}
          TRAINING_FB_PAGE_ID:    ${{ secrets.TRAINING_FB_PAGE_ID }}
          # --- HERITAGE (Seek the Cradle, @seekthecradle) ---
          HERITAGE_IG_TOKEN:      ${{ secrets.TRAINING_IG_TOKEN }}   # ten sam SUAT bota avufu-publisher-bot (IG @seekthecradle przypiete do bota -> bez regeneracji)
          HERITAGE_IG_USER_ID:    "17841480852486666"                # @seekthecradle IG Business Account id (jawne, nie-tajne)
          # HERITAGE_FB_PAGE_TOKEN pochodzi z kroku wyzej ($GITHUB_ENV) - NIE ustawiac tu z sekretu (puste by nadpisalo)
          HERITAGE_FB_PAGE_ID:    "1508324085691105"                 # strona FB Seek the Cradle = Graph page id (NIE 61596935420553 z URL-a!)
        run: python scripts/publish.py

      - name: Zapisz zmiany w kolejce
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A queue published failed 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Publikacja: aktualizacja kolejki [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
