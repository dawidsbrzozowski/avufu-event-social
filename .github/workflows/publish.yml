name: Publikuj posty (IG + FB)

# Czyta kolejke w queue/ i publikuje posty, ktorych czas nadszedl,
# przez Meta Graph API. Udane przenosi do published/.
#
# Na start dziala TYLKO recznie (workflow_dispatch) - zeby przetestowac
# po wgraniu sekretow. Gdy test przejdzie, ODKOMENTUJ blok `schedule`
# ponizej, aby publikacja chodzila automatycznie.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '*/30 * * * *'   # co 30 min (czas UTC!). ~1440 przebiegow/mc = w darmowym limicie.

permissions:
  contents: write   # pozwala zapisac przeniesione posty (queue -> published) z powrotem do repo

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publikuj zalegle posty
        env:
          GRAPH_VERSION: v23.0
          EVENT_ACCESS_TOKEN: ${{ secrets.EVENT_ACCESS_TOKEN }}
          EVENT_IG_USER_ID:  ${{ secrets.EVENT_IG_USER_ID }}
          EVENT_PAGE_ID:     ${{ secrets.EVENT_PAGE_ID }}
          TRAINING_ACCESS_TOKEN: ${{ secrets.TRAINING_ACCESS_TOKEN }}
          TRAINING_IG_USER_ID:  ${{ secrets.TRAINING_IG_USER_ID }}
          TRAINING_PAGE_ID:     ${{ secrets.TRAINING_PAGE_ID }}
        run: python scripts/publish.py

      - name: Zapisz zmiany w kolejce
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A queue published failed 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Publikacja: aktualizacja kolejki [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
