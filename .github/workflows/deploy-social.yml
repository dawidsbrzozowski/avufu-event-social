name: Deploy /social to Hostinger

# Wgrywa grafiki z folderu `social/` tego repo do katalogu
# /home/u112202089/domains/event.avufu.com/public_html/social na Hostingerze.
# Odpala sie przy zmianach w `social/**` (oraz recznie) — nic innego na stronie nie rusza.

on:
  push:
    branches: [ main ]
    paths:
      - 'social/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload social assets via SCP (SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          key: ${{ secrets.SFTP_KEY }}
          passphrase: ${{ secrets.SFTP_KEY_PASSPHRASE }}
          # Zrodlo: CALY katalog `social` (bez glob `**` — jednoznaczne tarowanie
          # z zachowaniem struktury; `social/**` wczesniej nie wgrywal plikow).
          source: "social"
          # Cel: docroot domeny. tar zachowuje prefiks `social/`, wiec pliki
          # ladauja w .../public_html/social/...
          target: "/home/u112202089/domains/event.avufu.com/public_html/"
          overwrite: true
          rm: false

      - name: Weryfikacja — co jest na serwerze
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          key: ${{ secrets.SFTP_KEY }}
          passphrase: ${{ secrets.SFTP_KEY_PASSPHRASE }}
          script: |
            DIR=/home/u112202089/domains/event.avufu.com/public_html/social
            echo "Plikow w $DIR:"
            find "$DIR" -type f 2>/dev/null | wc -l
            echo "Przyklad zawartosci:"
            find "$DIR" -type f 2>/dev/null | head -10
