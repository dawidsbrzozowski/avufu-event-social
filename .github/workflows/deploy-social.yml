name: Deploy /social to Hostinger

# Wgrywa grafiki z folderu `social/` tego repo do katalogu
# /home/u112202089/domains/event.avufu.com/public_html/social na Hostingerze.
# Odpala sie przy zmianach w `social/**` (oraz recznie) — nic innego na stronie nie rusza.
#
# Klucz SSH trzymamy w sekrecie SFTP_KEY_B64 (klucz prywatny OpenSSH zakodowany
# base64 w JEDNEJ linii — odporne na psucie przy wklejaniu). Workflow sam go dekoduje.

on:
  push:
    branches: [ main ]
    paths:
      - 'social/**'
  workflow_dispatch: {}

env:
  REMOTE_DIR: /home/u112202089/domains/event.avufu.com/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Przygotuj klucz SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Naglowek klucza (powinno byc OPENSSH PRIVATE KEY):"
          head -1 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SFTP_PORT }}" "${{ secrets.SFTP_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Wgraj grafiki (scp)
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.SFTP_PORT }}" \
              -o StrictHostKeyChecking=no -r \
              social "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:${REMOTE_DIR}/"

      - name: Weryfikacja — co jest na serwerze
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SFTP_PORT }}" \
              -o StrictHostKeyChecking=no \
              "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}" \
              "echo 'Plikow w social:'; find ${REMOTE_DIR}/social -type f | wc -l; find ${REMOTE_DIR}/social -type f | head -10"
